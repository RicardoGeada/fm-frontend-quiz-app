  <body>
    <div id="root"></div>
    <script>
      const savedTheme = localStorage.getItem("theme");

      const theme = savedTheme ?? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

      document.documentElement.dataset.theme = theme;
    </script>
  </body>
